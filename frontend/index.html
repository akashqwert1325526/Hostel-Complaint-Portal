<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Complaint Management Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-1: #f9f6f1;
            --bg-2: #fefcf8;
            --text-main: #1e1d1a;
            --text-muted: #666052;
            --brand: #1f7a6b;
            --brand-2: #165e52;
            --accent: #c26b2e;
            --danger: #b9382f;
            --line: rgba(30, 29, 26, 0.1);
            --glass: rgba(255, 255, 255, 0.75);
            --shadow-soft: 0 10px 30px rgba(31, 29, 26, 0.08);
        }
        body {
            font-family: 'Manrope', sans-serif;
            background: radial-gradient(circle at 0% 10%, #f1ece2 0%, transparent 38%),
                        radial-gradient(circle at 100% 90%, #e9f2f0 0%, transparent 35%),
                        linear-gradient(160deg, var(--bg-1), var(--bg-2));
            color: var(--text-main);
            position: relative;
            overflow-x: hidden;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 999px;
            z-index: -1;
            filter: blur(10px);
            opacity: 0.35;
            animation: floatBlob 11s ease-in-out infinite;
        }
        body::before { top: -80px; right: -60px; background: #e7d5c4; }
        body::after { bottom: -100px; left: -80px; background: #cce5df; animation-delay: 1.5s; }
        .heading-font { font-family: 'Sora', sans-serif; }
        .fade-in { animation: fadeIn 0.45s ease-out both; }
        .section-reveal { animation: fadeIn 0.55s ease-out both; }
        .card-lift {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-soft);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .card-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 35px rgba(31, 29, 26, 0.13);
            border-color: rgba(31, 122, 107, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            color: #fff;
            border: 1px solid transparent;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(22, 94, 82, 0.25); }
        .btn-secondary {
            background: rgba(194, 107, 46, 0.12);
            color: var(--accent);
            border: 1px solid rgba(194, 107, 46, 0.25);
        }
        .btn-secondary:hover { background: rgba(194, 107, 46, 0.2); }
        .btn-tab-active { background: var(--text-main); color: #fff; }
        .btn-tab { background: #fff; color: var(--text-muted); border: 1px solid var(--line); }
        .input-neo {
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.85);
            border-radius: 10px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-neo:focus {
            outline: none;
            border-color: rgba(31, 122, 107, 0.5);
            box-shadow: 0 0 0 4px rgba(31, 122, 107, 0.12);
        }
        .pulse-critical {
            animation: pulse-red 2s infinite;
            border-left: 4px solid var(--danger);
        }
        .queue-item { animation: slideUp 0.35s ease both; }
        .main-content { min-height: calc(100vh - 72px - 62px); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(185, 56, 47, 0.35); }
            70% { box-shadow: 0 0 0 14px rgba(185, 56, 47, 0); }
            100% { box-shadow: 0 0 0 0 rgba(185, 56, 47, 0); }
        }
        @keyframes floatBlob {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(14px); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-white/70 backdrop-blur-md border-b border-stone-200/80 z-10 sticky top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center cursor-pointer" onclick="setView('landing')">
                    <span class="p-2 rounded-xl bg-emerald-100/80 text-emerald-800">
                        <i data-lucide="building-2" class="h-6 w-6"></i>
                    </span>
                    <span class="ml-2 text-xl font-bold heading-font tracking-tight">HostelMate</span>
                </div>
                <div class="flex items-center space-x-4" id="nav-controls"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow main-content">
        <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8" id="app-root"></div>
    </main>
    
    <!-- Footer -->
    <footer class="bg-white/60 border-t border-stone-200 py-4 backdrop-blur-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-stone-500 text-sm">
            <p>&copy; AGR. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // --- Global State Variables ---
        let currentView = 'landing';
        let isWardenAuthenticated = false;
        let isStudentAuthenticated = false;
        const API_BASE = 'http://localhost:8080/api';
        
        let complaints = [];
        
        let announcements = [
            { id: 1, text: "Hostel gates close at 10:00 PM strictly.", date: "2024-11-20" },
            { id: 2, text: "Water tank cleaning scheduled for Sunday.", date: "2024-11-22" }
        ];

        // --- Helpers ---
        const formatDate = (timestamp) => {
            if (!timestamp) return 'N/A';
            return new Date(timestamp).toLocaleString('en-US', {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        };

        const getEstimatedTime = (priority) => {
            switch(priority) {
                case 1: return "IMMEDIATE"; 
                case 2: return "24 Hours";
                case 3: return "2-3 Days";
                case 4: return "3-5 Days";
                default: return "Unknown";
            }
        };

        // --- CORE SORTING LOGIC (Priority Queue) ---
        const sortComplaints = (list) => {
            return list.slice().sort((a, b) => {
                // 1. Sort by Priority (1 is highest, so a - b)
                if (a.priority !== b.priority) {
                    return a.priority - b.priority; 
                }
                // 2. Sort by Time (FIFO - Older first)
                return a.timestamp - b.timestamp;
            });
        };

        // --- UPDATED PRIORITY LOGIC ---
        const getPriority = (type) => {
            // Catch "CRITICAL" from dropdown options immediately
            if (type.includes('CRITICAL')) return 1;
            
            if (type.includes('Medical')) return 1; 
            if (type.includes('Danger') || type.includes('Flooding')) return 1;
            
            if (type.includes('Minor')) return 2;
            if (type.includes('Internet') || type.includes('Furniture')) return 3;
            
            return 4; // Default Low
        };

        // --- Logic Functions ---
        const loadComplaints = async () => {
            const response = await fetch(`${API_BASE}/complaints`);
            if (!response.ok) {
                throw new Error('Failed to load complaints');
            }
            const data = await response.json();
            complaints = Array.isArray(data) ? data : [];
        };

        const addComplaint = async (formData) => {
            const newComplaint = {
                id: Date.now(), 
                timestamp: Date.now(),
                resolvedTimestamp: null,
                status: "PENDING",
                name: formData.name,
                room: formData.room,
                type: formData.type,
                desc: formData.desc,
                priority: getPriority(formData.type)
            };
            const response = await fetch(`${API_BASE}/complaints`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(newComplaint)
            });

            if (!response.ok) {
                throw new Error('Server failed to save complaint');
            }

            await loadComplaints();
            alert("Complaint saved to database and lodged!");
            setView('landing');
        };

        const updateComplaintStatus = async (id, status) => {
            const response = await fetch(`${API_BASE}/complaints/${id}/status`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status })
            });
            if (!response.ok) {
                throw new Error('Failed to update complaint status');
            }
        };

        const attachComplaintFormListener = () => {
            const form = document.getElementById('complaint-form');
            if (form) {
                form.onsubmit = async (e) => {
                    e.preventDefault();
                    const formData = {
                        name: form.elements.name.value,
                        room: form.elements.room.value,
                        type: form.elements.type.value,
                        desc: form.elements.desc.value,
                    };
                    try {
                        await addComplaint(formData);
                    } catch (error) {
                        alert("Failed to save complaint to database. Please make sure backend is running.");
                    }
                };
            }
        };

        const handleWardenLogin = (password) => {
            if (password === 'admin123') {
                isWardenAuthenticated = true;
                render();
            } else {
                showError('WardenLogin', 'Incorrect password. Try "admin123"');
            }
        };

        const handleStudentLogin = (password) => {
            if (password === 'student123') {
                isStudentAuthenticated = true;
                render();
            } else {
                showError('StudentLogin', 'Incorrect password. Try "student123"');
            }
        };

        const handleLogout = () => {
            isStudentAuthenticated = false;
            isWardenAuthenticated = false;
            setView('landing');
        };

        const setView = (viewName) => {
            currentView = viewName;
            render();
        };
        
        const handleResolve = async (id) => {
            try {
                await updateComplaintStatus(id, "RESOLVED");
                await loadComplaints();
                render();
            } catch (error) {
                alert("Failed to resolve complaint in database.");
            }
        };

        const addAnnouncement = (text) => {
            if (!text.trim()) return;
            announcements.unshift({
                id: Date.now(),
                text: text,
                date: new Date().toISOString().split('T')[0]
            });
            render();
        };

        const deleteAnnouncement = (id) => {
            announcements = announcements.filter(a => a.id !== id);
            render();
        };

        const showError = (id, message) => {
            const container = document.getElementById(id);
            if (container) container.querySelector('.auth-error-message').textContent = message;
        };

        // --- View HTML Generators ---
        const renderNavControls = () => {
            const navEl = document.getElementById('nav-controls');
            let html = `
                <button onclick="setView('landing')" class="px-3 py-2 rounded-lg text-sm font-semibold transition ${currentView === 'landing' ? 'btn-tab-active' : 'btn-tab'}">Home</button>
                <button onclick="setView('student')" class="px-3 py-2 rounded-lg text-sm font-semibold transition ${currentView === 'student' ? 'btn-tab-active' : 'btn-tab'}">Student</button>
                <button onclick="setView('warden')" class="px-3 py-2 rounded-lg text-sm font-semibold transition ${currentView === 'warden' ? 'btn-tab-active' : 'btn-tab'}">Warden</button>
            `;
            if (isStudentAuthenticated || isWardenAuthenticated) {
                html += `<button onclick="handleLogout()" class="ml-2 px-3 py-2 rounded-lg text-sm font-semibold btn-secondary transition-colors">Log Out</button>`;
            }
            navEl.innerHTML = html;
        };

        const renderLandingPage = () => {
            return `
                <div class="fade-in space-y-12">
                    <div class="text-center section-reveal">
                        <h1 class="heading-font text-4xl tracking-tight font-extrabold text-stone-900 sm:text-5xl md:text-6xl">
                            <span class="block">Hostel Complaint</span>
                            <span class="block text-emerald-700">Management Portal</span>
                        </h1>
                        <p class="mt-4 max-w-2xl mx-auto text-stone-600">Fast issue reporting with a live priority queue, beautiful clarity for students, and a no-noise dashboard for wardens.</p>
                    </div>
                    ${announcements.length > 0 ? `
                        <div class="max-w-3xl mx-auto card-lift p-4 rounded-xl section-reveal">
                            <div class="flex items-center mb-3">
                                <i data-lucide="megaphone" class="h-5 w-5 text-amber-700 mr-2"></i>
                                <h3 class="text-lg font-bold text-amber-900 heading-font">Notice Board</h3>
                            </div>
                            <div class="space-y-2">
                                ${announcements.map(a => `
                                    <div class="flex justify-between items-start text-sm border-b border-stone-200 last:border-0 pb-2 last:pb-0">
                                        <span class="text-stone-800 font-medium">${a.text}</span>
                                        <span class="text-stone-500 text-xs ml-4 whitespace-nowrap">${a.date}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>` : ''}
                    <div class="grid grid-cols-1 gap-8 md:grid-cols-2">
                        <div onclick="setView('student')" class="relative group card-lift p-6 cursor-pointer rounded-2xl section-reveal">
                            <span class="rounded-xl inline-flex p-3 bg-emerald-100 text-emerald-700 ring-4 ring-white/60"><i data-lucide="user" class="h-6 w-6"></i></span>
                            <div class="mt-8"><h3 class="text-lg font-bold heading-font">Student Portal</h3><p class="mt-2 text-sm text-stone-500">Lodge complaints and track live queue status.</p></div>
                        </div>
                        <div onclick="setView('warden')" class="relative group card-lift p-6 cursor-pointer rounded-2xl section-reveal">
                            <span class="rounded-xl inline-flex p-3 bg-amber-100 text-amber-800 ring-4 ring-white/60"><i data-lucide="shield-alert" class="h-6 w-6"></i></span>
                            <div class="mt-8"><h3 class="text-lg font-bold heading-font">Warden Dashboard</h3><p class="mt-2 text-sm text-stone-500">Prioritize and resolve complaints with confidence.</p></div>
                        </div>
                    </div>
                </div>`;
        };

        const renderAuthCard = (id, title, passwordDemo, color) => {
            return `
                <div id="${id}" class="max-w-md mx-auto card-lift py-8 px-4 sm:rounded-2xl sm:px-10 fade-in">
                    <div class="sm:mx-auto sm:w-full sm:max-w-md mb-6 text-center">
                        <h2 class="mt-6 text-center text-3xl font-extrabold heading-font text-stone-900">${title}</h2>
                    </div>
                    <form id="auth-form-${id}" class="space-y-6">
                        <div class="auth-error-message text-sm text-rose-700 text-center"></div>
                        <div>
                            <input id="password-${id}" type="password" required class="input-neo block w-full pl-3 pr-3 py-2" placeholder="Enter password" />
                        </div>
                        <button type="submit" class="w-full py-2 px-4 rounded-lg shadow-sm text-sm font-semibold btn-primary">Sign in</button>
                    </form>
                    <div class="mt-6 text-center text-stone-500 text-sm">Demo: <span class="font-semibold text-stone-900">${passwordDemo}</span></div>
                </div>
            `;
        };

        const renderStudentDashboard = (pending) => {
            return `
                <div class="fade-in">
                    <div id="student-tab-controls" class="flex space-x-4 mb-6">
                        <button onclick="switchStudentTab('lodge')" id="lodge-tab" class="px-4 py-2 rounded-lg font-semibold btn-tab-active">Lodge Complaint</button>
                        <button onclick="switchStudentTab('queue')" id="queue-tab" class="px-4 py-2 rounded-lg font-semibold btn-tab">Live Queue</button>
                    </div>
                    <div id="student-content-area">${renderStudentForm()}</div>
                </div>`;
        };

        const renderStudentForm = () => `
            <div class="card-lift sm:rounded-2xl p-6">
                <form id="complaint-form" class="space-y-4">
                    <input name="name" placeholder="Full Name" required class="w-full p-2 input-neo" />
                    <input name="room" placeholder="Room Number" required class="w-full p-2 input-neo" />
                    <select name="type" class="w-full p-2 input-neo">
                        <option>General Maintenance</option>
                        <option>Furniture Repair</option>
                        <option>Internet/Wi-Fi</option>
                        <!-- ADDED PLUMBING MINOR OPTION HERE -->
                        <option>Plumbing (Minor)</option> 
                        <option>Electrical (Minor)</option>
                        <option>🔥 Electrical - CRITICAL</option>
                        <option>💧 Plumbing - CRITICAL</option>
                        <option value="Medical">🚑 Medical Emergency - CRITICAL</option>
                    </select>
                    <textarea name="desc" rows="3" placeholder="Description" required class="w-full p-2 input-neo"></textarea>
                    <button type="submit" class="w-full py-2 px-4 rounded-lg btn-primary font-semibold">Submit</button>
                </form>
            </div>`;

        const renderQueueStatus = (pending) => `
            <div class="card-lift sm:rounded-2xl overflow-hidden">
                <div class="px-4 py-5 bg-emerald-50 border-b border-emerald-100 font-semibold text-emerald-900 heading-font">Current Queue</div>
                <ul class="divide-y divide-gray-200">
                    ${pending.length === 0 ? '<li class="p-8 text-center text-gray-500">No pending complaints.</li>' : pending.map((c, i) => `
                        <li style="animation-delay:${i * 40}ms" class="queue-item px-4 py-4 flex justify-between items-center ${c.priority === 1 ? 'bg-red-50 pulse-critical' : ''}">
                            <div class="flex items-center space-x-3">
                                <span class="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center text-xs font-bold">${i + 1}</span>
                                <div>
                                    <p class="text-sm font-medium text-gray-900">${c.type} ${c.priority === 1 ? '<span class="text-red-600 font-bold text-xs">CRITICAL</span>' : ''}</p>
                                    
                                    <!-- ADDED STUDENT NAME FOR LIVE QUEUE -->
                                    <p class="text-xs text-gray-700 font-semibold">Student: ${c.name}</p>
                                    
                                    <p class="text-xs text-gray-500">Registered: ${formatDate(c.timestamp)}</p>
                                    <p class="text-xs text-emerald-700">Est. Time: ${getEstimatedTime(c.priority)}</p>
                                </div>
                            </div>
                            <span class="text-xs text-gray-400">Room ${c.room}</span>
                        </li>
                    `).join('')}
                </ul>
            </div>`;

        const renderWardenDashboard = (sorted) => {
            const pending = sorted.filter(c => c.status === "PENDING");
            const resolved = complaints.filter(c => c.status === "RESOLVED");

            return `
                <div class="space-y-6 fade-in">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 grid grid-cols-3 gap-4 text-center">
                            <div class="p-4 card-lift rounded-xl border-l-4 border-red-500">
                                <div class="text-2xl font-bold text-red-700">${pending.filter(c => c.priority === 1).length}</div>
                                <div class="text-xs text-stone-500">Critical</div>
                            </div>
                            <div class="p-4 card-lift rounded-xl border-l-4 border-emerald-500">
                                <div class="text-2xl font-bold text-emerald-700">${pending.length}</div>
                                <div class="text-xs text-stone-500">Pending</div>
                            </div>
                            <div class="p-4 card-lift rounded-xl border-l-4 border-amber-500">
                                <div class="text-2xl font-bold text-green-700">${resolved.length}</div>
                                <div class="text-xs text-stone-500">Resolved</div>
                            </div>
                        </div>
                        <div class="card-lift rounded-xl p-4">
                            <form id="announcement-form" class="flex gap-2">
                                <input id="announcement-input" class="flex-1 input-neo px-2 text-sm" placeholder="Post Notice..." required />
                                <button class="btn-primary text-white px-3 text-sm rounded-lg font-semibold">Post</button>
                            </form>
                            <div class="mt-2 space-y-1 max-h-32 overflow-y-auto">
                                ${announcements.map(a => `<div class="text-xs bg-stone-50 p-2 rounded flex justify-between"><span>${a.text}</span><button onclick="deleteAnnouncement(${a.id})" class="text-rose-600 font-bold">x</button></div>`).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- PENDING QUEUE -->
                    <div class="card-lift rounded-2xl">
                        <div class="px-4 py-3 border-b flex justify-between items-center">
                            <h3 class="font-bold text-stone-700 heading-font">Priority Queue (Pending)</h3>
                            <div class="text-xs text-stone-500">Live Sort (Critical First)</div>
                        </div>
                        <ul class="divide-y divide-gray-200">
                            ${pending.length === 0 ? '<li class="p-4 text-center text-gray-500">No pending complaints.</li>' : pending.map((c, index) => `
                                <li style="animation-delay:${index * 35}ms" class="queue-item p-4 hover:bg-stone-50/70 flex justify-between items-center ${c.priority === 1 ? 'bg-red-50 pulse-critical' : ''}">
                                    <div>
                                        <div class="font-medium text-gray-900 flex items-center gap-2">
                                            ${c.type}
                                            ${c.priority === 1 ? '<span class="bg-red-100 text-red-800 text-[10px] px-2 rounded">CRITICAL</span>' : ''}
                                        </div>
                                        <div class="text-xs text-gray-500 mt-1">
                                            <span class="mr-3 font-semibold text-gray-700">Student: ${c.name}</span>
                                            <span class="mr-3">Room: ${c.room}</span>
                                            <span class="mr-3">Registered: ${formatDate(c.timestamp)}</span>
                                        </div>
                                        <div class="text-xs text-gray-500">${c.desc}</div>
                                    </div>
                                    <button onclick="handleResolve(${c.id})" class="px-3 py-1 rounded-lg text-sm font-semibold btn-primary">Resolve</button>
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <!-- RESOLVED HISTORY -->
                    <div class="card-lift rounded-2xl mt-6">
                        <div class="px-4 py-3 border-b bg-green-50/70">
                            <h3 class="font-bold text-green-800 heading-font">Resolved History</h3>
                        </div>
                        <ul class="divide-y divide-gray-200 max-h-64 overflow-y-auto">
                            ${resolved.length === 0 ? '<li class="p-4 text-center text-gray-500">No history available.</li>' : resolved.map((c, index) => `
                                <li style="animation-delay:${index * 30}ms" class="queue-item p-4 flex justify-between items-center bg-stone-50/70 opacity-75">
                                    <div>
                                        <div class="font-medium text-gray-700 line-through">${c.type}</div>
                                        <div class="text-xs text-gray-500 mt-1">
                                            <span class="mr-3 font-semibold">Student: ${c.name}</span>
                                            <div class="flex flex-col mt-1">
                                                <span>Registered: ${formatDate(c.timestamp)}</span>
                                                <span class="text-green-600 font-medium">Resolved: ${formatDate(c.resolvedTimestamp)}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">DONE</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>`;
        };

        const switchStudentTab = (tab) => {
            const content = document.getElementById('student-content-area');
            const sorted = sortComplaints(complaints.filter(c => c.status === 'PENDING'));
            
            document.getElementById('lodge-tab').className = tab === 'lodge' ? 'px-4 py-2 rounded-lg font-semibold btn-tab-active' : 'px-4 py-2 rounded-lg font-semibold btn-tab';
            document.getElementById('queue-tab').className = tab === 'queue' ? 'px-4 py-2 rounded-lg font-semibold btn-tab-active' : 'px-4 py-2 rounded-lg font-semibold btn-tab';

            if (tab === 'lodge') {
                content.innerHTML = renderStudentForm();
                attachComplaintFormListener();
            } else {
                content.innerHTML = renderQueueStatus(sorted);
                lucide.createIcons();
            }
        };

        const attachAuthListener = (id, handler) => {
            const form = document.getElementById(`auth-form-${id}`);
            if (form) form.onsubmit = (e) => { e.preventDefault(); handler(document.getElementById(`password-${id}`).value); };
        };

        const attachAnnouncementFormListener = () => {
            const form = document.getElementById('announcement-form');
            if (form) {
                form.onsubmit = (e) => {
                    e.preventDefault();
                    const input = document.getElementById('announcement-input');
                    addAnnouncement(input.value);
                    input.value = '';
                };
            }
        };

        const render = () => {
            const root = document.getElementById('app-root');
            if (currentView === 'landing') root.innerHTML = renderLandingPage();
            else if (currentView === 'student') root.innerHTML = isStudentAuthenticated ? renderStudentDashboard(sortComplaints(complaints)) : renderAuthCard('StudentLogin', 'Student Portal', 'student123', 'indigo');
            else if (currentView === 'warden') root.innerHTML = isWardenAuthenticated ? renderWardenDashboard(sortComplaints(complaints)) : renderAuthCard('WardenLogin', 'Warden Access', 'admin123', 'red');
            
            lucide.createIcons();
            renderNavControls();

            if (currentView === 'student' && !isStudentAuthenticated) attachAuthListener('StudentLogin', handleStudentLogin);
            if (currentView === 'student' && isStudentAuthenticated) attachComplaintFormListener();
            if (currentView === 'warden' && !isWardenAuthenticated) attachAuthListener('WardenLogin', handleWardenLogin);
            if (currentView === 'warden' && isWardenAuthenticated) attachAnnouncementFormListener();
        };

        window.onload = async () => {
            try {
                await loadComplaints();
            } catch (error) {
                console.error('Could not load complaints from backend:', error);
                alert("Warning: Could not load complaints from backend. Please check if backend is running.");
            }
            render();
        };
    </script>
</body>
</html>
